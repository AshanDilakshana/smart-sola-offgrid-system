name: ESP32 Smart Offgrid CI/CD Pipeline

on:
  push:
    branches: [ '**' ]  # Triggers automatically on any branch push
  pull_request:
    branches: [ '**' ]

jobs:
  # Automated ESP32 Firmware Compilation
  compile-esp32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Board Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Required Arduino Libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "RTClib"
          arduino-cli lib install "NTPClient"

      - name: Compile ESP32 Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir ./build smart_offgrid_logic_/smart_offgrid_logic_.ino

      - name: Upload Firmware Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-${{ github.ref_name }}
          path: ./build/smart_offgrid_logic_.ino.bin

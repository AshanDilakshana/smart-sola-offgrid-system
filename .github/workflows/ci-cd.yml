name: ESP32 Smart Offgrid CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: write

jobs:
  compile-esp32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Board Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Required Arduino Libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "RTClib"
          arduino-cli lib install "NTPClient"

      - name: Compile ESP32 Sketch
        run: |
          mkdir -p smart_offgrid_logic_/build
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir smart_offgrid_logic_/build smart_offgrid_logic_/smart_offgrid_logic_.ino

      - name: Commit Compiled Firmware Binary to Branch
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Build: Update compiled ESP32 firmware binary"
          file_pattern: "smart_offgrid_logic_/build/smart_offgrid_logic_.ino.bin"
